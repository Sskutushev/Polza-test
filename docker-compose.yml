services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polza}
      POSTGRES_DB: ${POSTGRES_DB:-polza}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polza}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
